<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#120f1d">
<title>Replay-Kino für osu!</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#120f1d;--panel:#1d1830;--line:#2f2850;--tx:#f1ecff;--dim:#9b92c4;--pink:#ff5fa2;--mint:#7de3d0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 Sora,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
.wrap{max-width:900px;margin:0 auto;padding:16px}
#login{min-height:100vh;display:grid;align-content:center;gap:20px;padding:24px;max-width:560px;margin:auto}
#login h1{font-size:clamp(2.4rem,9vw,4.2rem);line-height:1;margin:0;font-weight:800;letter-spacing:-.03em}
#login p{color:var(--dim);margin:0}
.btn{background:var(--pink);color:#1a0b14;border:0;border-radius:999px;padding:14px 26px;font-weight:800;text-decoration:none;display:inline-block;width:max-content}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
#who{display:flex;align-items:center;gap:10px}
#who img{width:40px;height:40px;border-radius:50%}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:8px 16px;color:var(--dim);text-decoration:none;font-size:.9rem}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{background:none;border:1px solid var(--line);border-radius:999px;padding:8px 18px;color:var(--dim)}
.tabs button[aria-pressed=true]{background:var(--mint);color:#07241f;border-color:var(--mint);font-weight:600}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.row b{display:block;overflow-wrap:anywhere}
.row small{color:var(--dim)}
.row button{flex:none;width:48px;height:48px;border-radius:50%;border:0;background:var(--pink);color:#1a0b14;font-size:1.1rem}
#viewer{position:fixed;inset:0;background:var(--bg);z-index:5;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
#vbar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0}
#title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#stage{flex:1;display:grid;place-items:center;min-height:0}
canvas{width:100%;max-width:min(100%,calc((100vh - 190px)*4/3));aspect-ratio:4/3;background:#0b0914;border-radius:12px;touch-action:manipulation}
#ctl{display:flex;align-items:center;gap:10px;padding:12px 0}
#ctl input[type=range]{flex:1;accent-color:var(--pink);height:32px}
#ctl button,#ctl select{background:var(--panel);border:1px solid var(--line);border-radius:10px;height:44px;min-width:44px;padding:0 10px;color:var(--tx)}
#time{color:var(--dim);font-variant-numeric:tabular-nums;font-size:.85rem}
.msg{color:var(--dim);text-align:center;padding:8px}
</style>
</head>
<body>
<section id="login" hidden>
  <h1>Deine Replays, überall.</h1>
  <p>Verbinde dein osu!-Konto und schau dir deine letzten und besten Plays auf Handy, Tablet oder PC an.</p>
  <a class="btn" href="/.netlify/functions/auth">Mit osu! verbinden</a>
</section>

<main id="app" class="wrap" hidden>
  <header><div id="who"></div><a class="ghost" href="/.netlify/functions/auth?logout=1">Abmelden</a></header>
  <div class="tabs">
    <button aria-pressed="true" data-t="recent">Zuletzt gespielt</button>
    <button aria-pressed="false" data-t="best">Beste Plays</button>
  </div>
  <div id="list"></div>
</main>

<section id="viewer" hidden>
  <div id="vbar"><div id="title"></div><button class="ghost" id="close">Schließen</button></div>
  <div id="stage"><canvas id="cv" width="960" height="720"></canvas></div>
  <div id="msg" class="msg"></div>
  <div id="ctl">
    <button id="pp" aria-label="Abspielen oder pausieren">▶</button>
    <input id="seek" type="range" min="0" value="0" step="10" aria-label="Zeitleiste">
    <span id="time">0:00</span>
    <select id="spd" aria-label="Geschwindigkeit"><option value="0.5">0.5x</option><option value="1" selected>1x</option><option value="2">2x</option></select>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/lzma@2.3.2/src/lzma-d-min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const api = (p, q = {}) => fetch('/.netlify/functions/api?' + new URLSearchParams({ path: p, ...q }));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let me, tab = 'recent', scores = [];

async function init() {
  const r = await api('/me/osu');
  if (!r.ok) return ($('#login').hidden = false);
  me = await r.json();
  $('#app').hidden = false;
  $('#who').innerHTML = `<img src="${esc(me.avatar_url)}" alt=""><b>${esc(me.username)}</b>`;
  load();
}

async function load() {
  $('#list').innerHTML = '<div class="msg">Lade Scores…</div>';
  const r = await api(`/users/${me.id}/scores/${tab}`, { mode: 'osu', limit: tab === 'best' ? 50 : 30, include_fails: 1 });
  if (!r.ok) return ($('#list').innerHTML = `<div class="msg">Scores konnten nicht geladen werden (${r.status}).</div>`);
  scores = await r.json();
  $('#list').innerHTML = scores.map((s, i) => `<div class="row"><div><b>${esc(s.beatmapset.title)} [${esc(s.beatmap.version)}]</b><small>${s.rank} · ${(s.accuracy * 100).toFixed(2)}%${s.pp ? ' · ' + Math.round(s.pp) + 'pp' : ''}${(s.mods || []).length ? ' · ' + s.mods.map(m => m.acronym || m).join('') : ''}</small></div>${s.has_replay || s.replay ? `<button data-i="${i}" aria-label="Replay ansehen">▶</button>` : ''}</div>`).join('') || '<div class="msg">Noch keine Scores in osu!standard.</div>';
}

document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  tab = b.dataset.t;
  document.querySelectorAll('.tabs button').forEach(x => x.setAttribute('aria-pressed', x === b));
  load();
});
$('#list').onclick = e => { const b = e.target.closest('button[data-i]'); if (b) openReplay(scores[b.dataset.i]); };

/* ---------- .osr lesen ---------- */
function parseOsr(buf) {
  const d = new DataView(buf), u = new Uint8Array(buf); let p = 0;
  const b = () => d.getUint8(p++), sh = () => (p += 2, d.getUint16(p - 2, true)), i = () => (p += 4, d.getInt32(p - 4, true));
  const str = () => { if (b() !== 11) return ''; let n = 0, s = 0, c; do { c = b(); n |= (c & 127) << s; s += 7; } while (c & 128); const t = new TextDecoder().decode(u.subarray(p, p + n)); p += n; return t; };
  const mode = b(); i(); str(); str(); str(); p += 12; i(); sh(); b();
  const mods = i(); str(); p += 8; const len = i();
  return new Promise((res, rej) => LZMA.decompress(Array.from(u.subarray(p, p + len), x => x << 24 >> 24), t => {
    if (t == null) return rej(new Error('LZMA'));
    if (typeof t !== 'string') t = new TextDecoder().decode(new Uint8Array(t));
    let ms = 0; const F = [];
    for (const f of t.split(',')) { const [w, x, y, z] = f.split('|'); if (z === undefined || w === '-12345') continue; ms += +w; F.push({ t: ms, x: +x, y: +y, k: (+z) & 15 }); }
    res({ mode, mods, F });
  }));
}

/* ---------- .osu lesen ---------- */
function parseMap(txt, mods) {
  const m = { d: {}, tp: [], ho: [] }; let sec = '';
  for (let l of txt.split('\n')) {
    l = l.trim(); if (!l || l.startsWith('//')) continue;
    if (l[0] === '[') { sec = l; continue; }
    if (sec === '[General]' && l.startsWith('AudioFilename:')) m.audio = l.slice(14).trim();
    else if (sec === '[Difficulty]') { const [k, v] = l.split(':'); m.d[k] = +v; }
    else if (sec === '[TimingPoints]') { const a = l.split(','); m.tp.push({ t: +a[0], bl: +a[1], un: a[6] !== '0' }); }
    else if (sec === '[HitObjects]') {
      const a = l.split(','), o = { x: +a[0], y: +a[1], t: +a[2], type: +a[3] };
      if (o.type & 2) { o.pts = [[o.x, o.y], ...a[5].split('|').slice(1).map(q => q.split(':').map(Number))]; o.slides = +a[6]; o.len = +a[7]; }
      if (o.type & 8) o.end = +a[5];
      m.ho.push(o);
    }
  }
  const HR = mods & 16, EZ = mods & 2, SM = m.d.SliderMultiplier || 1.4;
  let n = 0, col = 0; const pal = ['#ff5fa2', '#7de3d0', '#ffd166', '#a78bfa'];
  for (const o of m.ho) {
    if (HR) { o.y = 384 - o.y; if (o.pts) o.pts = o.pts.map(([x, y]) => [x, 384 - y]); }
    if (o.type & 4 || o.type & 8) { n = 0; col++; }
    o.n = ++n; o.col = pal[col % 4];
    if (o.pts) {
      let bl = 500, sv = 1;
      for (const tp of m.tp) { if (tp.t > o.t) break; if (tp.un) { bl = tp.bl; sv = 1; } else sv = -100 / tp.bl; }
      o.end = o.t + o.len / (SM * 100 * sv) * bl * o.slides;
    } else if (!o.end) o.end = o.t;
  }
  let ar = m.d.ApproachRate ?? m.d.OverallDifficulty, cs = m.d.CircleSize;
  if (HR) { ar = Math.min(10, ar * 1.4); cs = Math.min(10, cs * 1.3); }
  if (EZ) { ar /= 2; cs /= 2; }
  m.pre = ar < 5 ? 1200 + 600 * (5 - ar) / 5 : 1200 - 750 * (ar - 5) / 5;
  m.r = 54.4 - 4.48 * cs;
  return m;
}

/* ---------- Player ---------- */
let M, F, t = 0, end = 0, rate = 1, playing = false, last = 0, running = false, audio = null;
const cv = $('#cv'), g = cv.getContext('2d');

async function openReplay(s) {
  $('#viewer').hidden = false; playing = false; M = null;
  if (audio) { audio.pause(); audio = null; }
  $('#title').textContent = `${s.beatmapset.title} [${s.beatmap.version}]`;
  const msg = x => ($('#msg').textContent = x);
  try {
    msg('Lade Replay…');
    let r = await api(`/scores/${s.id}/download`);
    if (!r.ok && s.legacy_score_id) r = await api(`/scores/${s.ruleset || 'osu'}/${s.legacy_score_id}/download`);
    if (!r.ok) return msg(`Replay-Download fehlgeschlagen (${r.status}).`);
    const osr = await parseOsr(await r.arrayBuffer());
    if (osr.mode !== 0) return msg('Aktuell wird nur osu!standard unterstützt.');
    msg('Lade Beatmap…');
    const b = await fetch('/.netlify/functions/beatmap?id=' + s.beatmap.id);
    if (!b.ok) return msg('Beatmap konnte nicht geladen werden.');
    M = parseMap(await b.text(), osr.mods); F = osr.F;
    msg('Lade Ton…');
    audio = M.audio ? await loadAudio(s.beatmapset.id, M.audio) : null;
    if (audio) audio.preservesPitch = !(osr.mods & 512);
    rate = osr.mods & (64 | 512) ? 1.5 : osr.mods & 256 ? 0.75 : 1;
    end = Math.max(F[F.length - 1].t, M.ho.at(-1).end) + 500;
    t = Math.max(0, M.ho[0].t - 2000); playing = false;
    $('#seek').max = end; msg(audio ? 'Tippe ▶ zum Start' : 'Kein Ton: Beatmap-Audio nicht erreichbar. Tippe ▶ zum Start');
    if (!running) { running = true; requestAnimationFrame(tick); }
  } catch (err) { msg('Replay konnte nicht gelesen werden.'); }
}

async function loadAudio(setId, file) {
  const mime = { mp3: 'audio/mpeg', ogg: 'audio/ogg', wav: 'audio/wav' }[file.split('.').pop().toLowerCase()] || 'audio/mpeg';
  for (const u of [`https://api.nerinyan.moe/d/${setId}?noVideo=true&noBg=true&NoHitsound=true&NoStoryboard=true`, `https://catboy.best/d/${setId}`]) {
    try {
      const r = await fetch(u); if (!r.ok) continue;
      const z = await JSZip.loadAsync(await r.arrayBuffer());
      const f = z.file(file) || Object.values(z.files).find(x => x.name.toLowerCase() === file.toLowerCase());
      if (f) return new Audio(URL.createObjectURL(new Blob([await f.async('arraybuffer')], { type: mime })));
    } catch {}
  }
  return null;
}

function syncAudio() {
  if (!audio) return;
  const want = t / 1000; audio.playbackRate = rate * +$('#spd').value;
  if (playing) {
    if (audio.paused) { audio.currentTime = want; audio.play().catch(() => { playing = false; }); }
    else if (Math.abs(audio.currentTime - want) > .2) audio.currentTime = want;
  } else if (!audio.paused) audio.pause();
}

function tick(n) {
  if (!$('#viewer').hidden && M) {
    if (playing) { t += (n - last) * +$('#spd').value * rate; if (t >= end) { t = end; playing = false; } }
    draw(t); syncAudio(); $('#seek').value = t; $('#pp').textContent = playing ? '❚❚' : '▶';
    const sec = Math.max(0, t / 1000 / rate) | 0; $('#time').textContent = `${sec / 60 | 0}:${String(sec % 60).padStart(2, '0')}`;
  }
  last = n; requestAnimationFrame(tick);
}

function draw(t) {
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, 960, 720);
  g.setTransform(1.5, 0, 0, 1.5, 96, 72);
  g.lineWidth = 1; g.strokeStyle = '#2f2850'; g.strokeRect(0, 0, 512, 384);
  const R = M.r, P = M.pre;
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.font = `bold ${R}px Sora,sans-serif`;
  for (let i = M.ho.length - 1; i >= 0; i--) {
    const o = M.ho[i], dt = o.t - t;
    if (dt > P || t > o.end + 150) continue;
    g.globalAlpha = Math.min(1, (P - dt) / (P * .4)) * (t > o.end ? Math.max(0, 1 - (t - o.end) / 150) : 1);
    if (o.type & 8) { g.strokeStyle = '#fff'; g.lineWidth = 3; g.beginPath(); g.arc(256, 192, 150 * Math.max(0, (o.end - t) / (o.end - o.t)), 0, 7); g.stroke(); continue; }
    if (o.pts) {
      g.lineWidth = R * 2; g.lineCap = g.lineJoin = 'round'; g.strokeStyle = 'rgba(255,255,255,.28)'; g.beginPath();
      o.pts.forEach(([x, y], j) => j ? g.lineTo(x, y) : g.moveTo(x, y)); g.stroke();
    }
    g.lineWidth = 3; g.fillStyle = o.col; g.strokeStyle = '#fff';
    g.beginPath(); g.arc(o.x, o.y, R, 0, 7); g.fill(); g.stroke();
    g.fillStyle = '#12091a'; g.fillText(o.n, o.x, o.y);
    if (dt > 0) { g.strokeStyle = '#fff'; g.lineWidth = 2; g.beginPath(); g.arc(o.x, o.y, R * (1 + 3 * dt / P), 0, 7); g.stroke(); }
  }
  g.globalAlpha = 1;
  let lo = 0, hi = F.length - 1;
  while (lo < hi) { const m = (lo + hi + 1) >> 1; F[m].t <= t ? lo = m : hi = m - 1; }
  g.lineWidth = 4; g.lineCap = 'round';
  for (let j = lo; j > 0 && F[j].t > t - 140; j--) {
    g.globalAlpha = Math.max(0, 1 - (t - F[j].t) / 140) * .6; g.strokeStyle = '#7de3d0';
    g.beginPath(); g.moveTo(F[j - 1].x, F[j - 1].y); g.lineTo(F[j].x, F[j].y); g.stroke();
  }
  g.globalAlpha = 1; const c = F[lo];
  g.fillStyle = c.k ? '#ff5fa2' : '#fff'; g.beginPath(); g.arc(c.x, c.y, c.k ? 9 : 7, 0, 7); g.fill();
}

$('#pp').onclick = cv.onclick = () => { if (!M) return; $('#msg').textContent = ''; if (t >= end) t = 0; playing = !playing; };
$('#seek').oninput = e => { t = +e.target.value; };
$('#close').onclick = () => { $('#viewer').hidden = true; playing = false; if (audio) audio.pause(); };
init();
</script>
</body>
</html>
