<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#120f1d">
<title>Replay-Kino für osu!</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#120f1d;--panel:#1d1830;--line:#2f2850;--tx:#f1ecff;--dim:#9b92c4;--pink:#ff5fa2;--mint:#7de3d0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 Sora,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
.wrap{max-width:900px;margin:0 auto;padding:16px}
#login{min-height:100vh;display:grid;align-content:center;gap:20px;padding:24px;max-width:560px;margin:auto}
#login h1{font-size:clamp(2.4rem,9vw,4.2rem);line-height:1;margin:0;font-weight:800;letter-spacing:-.03em}
#login p{color:var(--dim);margin:0}
.btn{background:var(--pink);color:#1a0b14;border:0;border-radius:999px;padding:14px 26px;font-weight:800;text-decoration:none;display:inline-block;width:max-content}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.hbtns{display:flex;gap:8px;align-items:center}
#who{display:flex;align-items:center;gap:10px;min-width:0}
#who img{width:40px;height:40px;border-radius:50%}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:8px 16px;color:var(--dim);text-decoration:none;font-size:.9rem}
.icon{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:44px;height:44px;display:grid;place-items:center;color:var(--tx);padding:0}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{background:none;border:1px solid var(--line);border-radius:999px;padding:8px 18px;color:var(--dim)}
.tabs button[aria-pressed=true]{background:var(--mint);color:#07241f;border-color:var(--mint);font-weight:600}
.tools{display:flex;gap:12px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
input[type=search]{flex:1;min-width:160px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 14px;color:var(--tx);font:inherit}
.chk{color:var(--dim);font-size:.9rem;display:flex;gap:6px;align-items:center}
.row{display:flex;align-items:center;gap:12px;padding:10px 6px;border-bottom:1px solid var(--line)}
.thumb{width:64px;height:64px;border-radius:12px;object-fit:cover;background:var(--panel);flex:none}
.mid{flex:1;min-width:0}
.mid b,.mid small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mid small{color:var(--dim)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:.75rem}
.chip.mod{color:var(--pink);border-color:#5b2a49}
.end{text-align:right;flex:none;display:grid;gap:1px}
.end b{font-size:1.2rem;line-height:1}
.end small{color:var(--dim);font-size:.75rem;white-space:nowrap}
.play{flex:none;width:48px;height:48px;border-radius:50%;border:0;background:var(--pink);color:#1a0b14;display:grid;place-items:center}
.more{display:block;margin:16px auto}
#viewer{position:fixed;inset:0;background:var(--bg);z-index:5;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
#title{font-weight:600;padding:10px 0 4px;overflow-wrap:anywhere}
#vbar{display:flex;gap:8px;padding:4px 0 8px;flex-wrap:wrap}
.vb{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:0 14px;height:44px;font-size:.9rem}
.vb:disabled{opacity:.5}
#stage{flex:1;display:grid;place-items:center;min-height:0}
canvas{width:100%;max-width:min(100%,calc((100vh - 230px)*4/3));aspect-ratio:4/3;background:#0b0914;border-radius:12px;touch-action:manipulation}
video{width:100%;max-width:min(100%,calc((100vh - 230px)*16/9));border-radius:12px;background:#000}
#ctl{display:flex;align-items:center;gap:10px;padding:12px 0}
#ctl input[type=range]{flex:1;accent-color:var(--pink);height:32px}
#ctl button,#ctl select{background:var(--panel);border:1px solid var(--line);border-radius:10px;height:44px;min-width:44px;padding:0 10px;color:var(--tx)}
#time{color:var(--dim);font-variant-numeric:tabular-nums;font-size:.85rem}
.msg{color:var(--dim);text-align:center;padding:8px}
.sheet{position:fixed;inset:0;z-index:9;background:var(--bg);display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.sh{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--line);font-weight:800;font-size:1.1rem}
.sb{overflow-y:auto;padding:8px 16px 40px;max-width:720px;width:100%;margin:0 auto;flex:1}
.sb h3{color:var(--mint);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;margin:24px 0 4px}
.ir,.srow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.ir span{color:var(--dim)}
.ir b,.ir a{text-align:right;overflow-wrap:anywhere}
.ir a{color:var(--mint)}
.srow.col{flex-direction:column;align-items:stretch;gap:6px}
.srow.col>span{display:flex;justify-content:space-between}
.sb input[type=range]{width:100%;accent-color:var(--pink);height:32px}
.sb select{background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font:inherit;max-width:60%}
.sw{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none;cursor:pointer;margin:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--tx);transition:transform .2s}
.sw:checked{background:var(--pink)}
.sw:checked::after{transform:translateX(18px)}
.hero{height:170px;border-radius:16px;background-size:cover;background-position:center;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;margin-top:8px}
.hero b{font-size:1.3rem}
.hero span{color:var(--dim)}
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;max-height:340px;overflow-y:auto}
.skin{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:6px;text-align:left;display:grid;gap:3px;align-content:start}
.skin.on{border-color:var(--pink)}
.skin img{width:100%;border-radius:8px;aspect-ratio:16/9;object-fit:cover;background:#000}
.skin small{color:var(--dim)}
.note{color:var(--dim);font-size:.85rem;padding:8px 0}
#vp{position:relative;width:100%;max-width:min(100%,calc((100vh - 230px)*16/9));aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;user-select:none;-webkit-user-select:none}
#vp:fullscreen{max-width:none;aspect-ratio:auto;height:100%;border-radius:0}
#vp video{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:contain;border-radius:0;background:#000}
#vbig{position:absolute;inset:0;margin:auto;width:76px;height:76px;border-radius:50%;background:rgba(18,15,29,.72);display:grid;place-items:center;pointer-events:none;color:#fff}
#vbig svg{width:34px;height:34px}
#vspin{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
#vspin i{width:42px;height:42px;border-radius:50%;border:4px solid rgba(255,255,255,.25);border-top-color:var(--pink);animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){#vspin i{animation-duration:2.5s}}
#verr{position:absolute;inset:0;display:grid;place-content:center;gap:10px;text-align:center;padding:16px;background:rgba(10,8,18,.88)}
#verr span{color:var(--dim);font-size:.9rem}
.vrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
#vc{position:absolute;left:0;right:0;bottom:0;padding:28px 10px 8px;background:linear-gradient(transparent,rgba(0,0,0,.78));display:grid;gap:2px;transition:opacity .25s}
#vp.idle #vc{opacity:0;pointer-events:none}
#vc .r1,#vc .r2{display:flex;align-items:center;gap:8px}
#vc .sp{flex:1}
.vbtn{background:none;border:0;color:#fff;width:40px;height:40px;display:grid;place-items:center;padding:0;border-radius:10px;text-decoration:none}
#vcur,#vdur{color:#e8e2ff;font-size:.8rem;font-variant-numeric:tabular-nums;min-width:34px}
#vseekw{flex:1;--p:0%;--b:0%;background:linear-gradient(to right,var(--pink) var(--p),#6b5ca5 var(--p) var(--b),rgba(255,255,255,.2) var(--b)) center/100% 5px no-repeat;border-radius:3px}
#vc input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;width:100%;height:32px;margin:0}
#vc input[type=range]::-webkit-slider-runnable-track{background:transparent;height:32px}
#vc input[type=range]::-moz-range-track{background:transparent}
#vc input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--pink);margin-top:8px}
#vc input[type=range]::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:var(--pink)}
#vvol{width:80px!important}
#vc select{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:8px;height:34px;padding:0 6px}
@media(max-width:520px){#vvol{display:none}}
</style>
</style>
</head>
<body>
<section id="login" hidden>
  <h1>Deine Replays, überall.</h1>
  <p>Verbinde dein osu!-Konto und schau dir deine letzten und besten Plays auf Handy, Tablet oder PC an.</p>
  <a class="btn" href="/.netlify/functions/auth">Mit osu! verbinden</a>
</section>

<main id="app" class="wrap" hidden>
  <header>
    <div id="who"></div>
    <div class="hbtns">
      <button class="icon" id="gear1" data-ic="gear" aria-label="Einstellungen"></button>
      <a class="ghost" href="/.netlify/functions/auth?logout=1">Abmelden</a>
    </div>
  </header>
  <div class="tabs">
    <button aria-pressed="true" data-t="recent">Zuletzt gespielt</button>
    <button aria-pressed="false" data-t="best">Beste Plays</button>
  </div>
  <div class="tools">
    <input id="q" type="search" placeholder="Titel, Artist, Mapper oder Difficulty suchen" aria-label="Scores durchsuchen">
    <label class="chk"><input type="checkbox" id="onlyRp" checked> nur mit Replay</label>
  </div>
  <div id="list"></div>
  <button class="ghost more" id="more" hidden>Mehr laden</button>
</main>

<section id="viewer" hidden>
  <div id="title"></div>
  <div id="vbar">
    <button class="vb" id="infoBtn" data-ic="info"><span>Details</span></button>
    <button class="vb" id="gear2" data-ic="gear"><span>Einstellungen</span></button>
    <button class="vb" id="mp4" data-ic="video"><span>mp4 rendern</span></button>
    <button class="vb" id="close" data-ic="x"><span>Schließen</span></button>
  </div>
  <div id="stage"><canvas id="cv" width="960" height="720"></canvas>
  <div id="vp" hidden>
    <video id="vid" playsinline preload="auto"></video>
    <div id="vbig" hidden data-ic="play"></div>
    <div id="vspin" hidden><i></i></div>
    <div id="verr" hidden><b>Video-Fehler</b><span id="verrt"></span><div class="vrow"><button class="ghost" id="vretry">Neu laden</button><a class="ghost" id="vopen" target="_blank" rel="noopener">Im Browser öffnen</a></div></div>
    <div id="vc">
      <div class="r1"><span id="vcur">0:00</span><div id="vseekw"><input id="vseek" type="range" min="0" max="1000" step="1" value="0" aria-label="Position"></div><span id="vdur">0:00</span></div>
      <div class="r2">
        <button class="vbtn" id="vpp" data-ic="play" aria-label="Abspielen oder pausieren"></button>
        <button class="vbtn" id="vmute" data-ic="vol" aria-label="Ton an oder aus"></button>
        <input id="vvol" type="range" min="0" max="1" step="0.05" value="1" aria-label="Lautstärke">
        <span class="sp"></span>
        <select id="vspd" aria-label="Wiedergabe-Geschwindigkeit"><option value="0.5">0.5x</option><option value="0.75">0.75x</option><option value="1" selected>1x</option><option value="1.25">1.25x</option><option value="1.5">1.5x</option><option value="2">2x</option></select>
        <a class="vbtn" id="vlink" data-ic="dl" target="_blank" rel="noopener" aria-label="Video öffnen oder herunterladen"></a>
        <button class="vbtn" id="vfs" data-ic="fs" aria-label="Vollbild"></button>
      </div>
    </div>
  </div></div>
  <div id="msg" class="msg"></div>
  <div id="ctl">
    <button id="pp" aria-label="Abspielen oder pausieren">▶</button>
    <input id="seek" type="range" min="0" value="0" step="10" aria-label="Zeitleiste">
    <span id="time">0:00</span>
    <select id="spd" aria-label="Geschwindigkeit"><option value="0.5">0.5x</option><option value="1" selected>1x</option><option value="2">2x</option></select>
  </div>
</section>

<section id="info" class="sheet" hidden>
  <div class="sh">Map- &amp; Score-Details<button class="icon" data-close data-ic="x" aria-label="Schließen"></button></div>
  <div class="sb" id="infoBody"></div>
</section>
<section id="settings" class="sheet" hidden>
  <div class="sh">Einstellungen<button class="icon" data-close data-ic="x" aria-label="Schließen"></button></div>
  <div class="sb" id="setBody"></div>
</section>

<script src="https://cdn.jsdelivr.net/npm/lzma@2.3.2/src/lzma-d-min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const api = (p, q = {}) => fetch('/.netlify/functions/api?' + new URLSearchParams({ path: p, ...q }));
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const svg = d => `<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const ICON = {
  gear: svg('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>'),
  info: svg('<circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>'),
  video: svg('<polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>'),
  x: svg('<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>'),
  play: svg('<polygon points="6 4 20 12 6 20 6 4" fill="currentColor"/>'),
  pause: svg('<rect x="6" y="4" width="4" height="16" fill="currentColor"/><rect x="14" y="4" width="4" height="16" fill="currentColor"/>'),
  vol: svg('<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>'),
  mute: svg('<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>'),
  fs: svg('<path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>'),
  dl: svg('<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>')
};
document.querySelectorAll('[data-ic]').forEach(e => e.insertAdjacentHTML('afterbegin', ICON[e.dataset.ic]));
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => { b.closest('.sheet').hidden = true; });

/* ---------- Einstellungen ---------- */
const DEF = {
  bg: true, dim: 78, trail: true, cursor: 1, hud: true, ticks: true, speed: '1', hitsounds: true, hsVol: 60, musicVol: 80,
  skin: '', skinName: '', resolution: '1280x720', globalVolume: 60, musicVolume: 60, hitsoundVolume: 60, useSkinHitsounds: true,
  inGameBGDim: 80, introBGDim: 60, breakBGDim: 70, cursorSize: 1, cursorTrail: true, cursorRainbow: false, showBorders: true, loadStoryboard: false, loadVideo: false,
  showScore: true, showHPBar: true, showComboCounter: true, showPPCounter: true, showHitErrorMeter: true, showUnstableRate: true, showSliderBreaks: true, showMods: true, showScoreboard: false, showResultScreen: false
};
let S = { ...DEF }; try { Object.assign(S, JSON.parse(localStorage.getItem('osuSet') || '{}')); } catch {}
const saveS = () => { try { localStorage.setItem('osuSet', JSON.stringify(S)); } catch {} };
const RK = Object.keys(DEF).filter(k => !['bg', 'dim', 'trail', 'cursor', 'hud', 'ticks', 'speed', 'hitsounds', 'hsVol', 'musicVol', 'skin', 'skinName'].includes(k));
const pct = [0, 100, 5, '%'];
const SCH = [
  ['Live-Ansicht', [['bg', 'Hintergrundbild', 't'], ['dim', 'Hintergrund abdunkeln', 'r', 0, 95, 5, '%'], ['trail', 'Cursor-Trail', 't'], ['cursor', 'Cursor-Größe', 'r', .5, 2, .1, 'x'], ['hud', 'HUD (Health, Score, Combo, Accuracy)', 't'], ['ticks', 'Slider-Ticks anzeigen', 't'], ['speed', 'Start-Geschwindigkeit', 's', [['0.5', '0.5x'], ['1', '1x'], ['2', '2x']]]]],
  ['Live-Ansicht · Ton', [['hitsounds', 'Hitsounds', 't'], ['hsVol', 'Hitsound-Lautstärke', 'r', ...pct], ['musicVol', 'Musik-Lautstärke', 'r', ...pct]]],
  ['mp4-Render · Allgemein', [['resolution', 'Auflösung', 's', [['960x540', '540p'], ['1280x720', '720p'], ['1920x1080', '1080p (braucht o!rdr-Freigabe)']]], ['skin', 'Skin', 'k'], ['globalVolume', 'Gesamtlautstärke', 'r', ...pct], ['musicVolume', 'Musiklautstärke', 'r', ...pct], ['hitsoundVolume', 'Hitsound-Lautstärke', 'r', ...pct], ['useSkinHitsounds', 'Hitsounds des Skins nutzen', 't']]],
  ['mp4-Render · Bild', [['inGameBGDim', 'Hintergrund im Spiel abdunkeln', 'r', ...pct], ['introBGDim', 'Hintergrund im Intro abdunkeln', 'r', ...pct], ['breakBGDim', 'Hintergrund in Pausen abdunkeln', 'r', ...pct], ['cursorSize', 'Cursor-Größe', 'r', .5, 2, .1, 'x'], ['cursorTrail', 'Cursor-Trail', 't'], ['cursorRainbow', 'Regenbogen-Cursor', 't'], ['showBorders', 'Spielfeld-Rahmen', 't'], ['loadStoryboard', 'Storyboard laden', 't'], ['loadVideo', 'Hintergrundvideo laden', 't']]],
  ['mp4-Render · Anzeige', [['showScore', 'Score', 't'], ['showHPBar', 'Health-Bar', 't'], ['showComboCounter', 'Combo', 't'], ['showPPCounter', 'PP-Zähler', 't'], ['showHitErrorMeter', 'Hit-Error-Meter', 't'], ['showUnstableRate', 'Unstable Rate', 't'], ['showSliderBreaks', 'Slider-Breaks', 't'], ['showMods', 'Mods', 't'], ['showScoreboard', 'Scoreboard', 't'], ['showResultScreen', 'Ergebnis-Bildschirm', 't']]]
];
function openSettings() {
  $('#setBody').innerHTML = SCH.map(([h, rows]) => `<h3>${h}</h3>` + rows.map(([k, l, t, a, b, st, u]) => {
    if (t === 't') return `<label class="srow"><span>${l}</span><input type="checkbox" class="sw" data-k="${k}" ${S[k] ? 'checked' : ''}></label>`;
    if (t === 'r') return `<label class="srow col"><span>${l}<b id="v_${k}">${S[k]}${u}</b></span><input type="range" data-k="${k}" data-u="${u}" min="${a}" max="${b}" step="${st}" value="${S[k]}"></label>`;
